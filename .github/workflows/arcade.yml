name: Generate arcade animation

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: generate galaga-contribution-graph
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          games: 'galaga'
          outputs: |
            dist/galaga-contribution-graph.svg?color_snake=#ff9900&color_dots=#120a00,#3d2400,#8a5200,#cc7a00,#ff9900
            dist/galaga-contribution-graph-dark.svg?palette=github-dark&color_snake=#ff9900&color_dots=#120a00,#3d2400,#8a5200,#cc7a00,#ff9900

      - name: push galaga-contribution-graph.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: pacman-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
